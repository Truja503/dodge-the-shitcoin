services:
  - type: web
    name: dodge-the-shitcoin
    runtime: node
    plan: starter
    buildCommand: cd server && npm ci
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/tournament.db
    disk:
      name: dodge-data
      mountPath: /var/data
      sizeGB: 1
