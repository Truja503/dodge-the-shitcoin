services:
  - type: web
    name: dodge-the-shitcoin
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /tmp/tournament.db
      - key: TOURNAMENT_ENTRY_SATS
        value: 100
      - key: BLINK_API_KEY
        sync: false
      - key: BLINK_RECEIVE_API_KEY
        sync: false
      - key: BLINK_READ_API_KEY
        sync: false
      - key: BLINK_WALLET_ID
        sync: false

