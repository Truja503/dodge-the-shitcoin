<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dodge the Shitcoin — Enter</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Space+Grotesk:wght@400;500;600;700&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
@font-face { font-family: "Cinzel"; src: url("assets/fonts/cinzel/Cinzel-Regular.ttf") format("truetype"); }
@font-face { font-family: "CinzelBold"; src: url("assets/fonts/cinzel/Cinzel-Bold.ttf") format("truetype"); }

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0b0f1a;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Cinzel', serif;
  overflow: hidden;
}

/* Particles bg */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at 30% 50%, rgba(56,189,248,0.05) 0%, transparent 50%),
              radial-gradient(ellipse at 70% 50%, rgba(245,166,35,0.05) 0%, transparent 50%);
  pointer-events: none;
}

.auth-box {
  background: rgba(20, 25, 39, 0.95);
  border: 1px solid rgba(30, 41, 59, 0.8);
  border-radius: 20px;
  padding: 3rem 2.5rem;
  width: 380px;
  max-width: 90vw;
  backdrop-filter: blur(20px);
  box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 80px rgba(56,189,248,0.05);
}

.auth-box h1 {
  text-align: center;
  font-family: 'CinzelBold', serif;
  font-size: 1.6rem;
  background: linear-gradient(135deg, #f5a623, #ffd700);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 20px rgba(245,166,35,0.3));
  margin-bottom: 0.3rem;
}

.subtitle {
  text-align: center;
  color: #64748b;
  font-size: 0.75rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 2rem;
}

/* Tabs */
.tabs {
  display: flex;
  gap: 0;
  margin-bottom: 1.5rem;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #1e293b;
}
.tab {
  flex: 1;
  padding: 0.7rem;
  text-align: center;
  font-family: 'CinzelBold', serif;
  font-size: 0.85rem;
  color: #64748b;
  background: rgba(15,20,30,0.8);
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 2px;
  border: none;
}
.tab.active {
  color: #e2e8f0;
  background: rgba(56,189,248,0.1);
  text-shadow: 0 0 10px rgba(56,189,248,0.3);
}
.tab:hover:not(.active) { color: #94a3b8; }

/* Form */
.form-group {
  margin-bottom: 1.2rem;
}
.form-group label {
  display: block;
  font-size: 0.7rem;
  color: #64748b;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 0.5rem;
}
.form-group input {
  width: 100%;
  padding: 0.8rem 1rem;
  font-size: 1rem;
  font-family: 'Cinzel', serif;
  background: rgba(10, 14, 25, 0.9);
  border: 1px solid #1e293b;
  border-radius: 10px;
  color: #f8fafc;
  outline: none;
  transition: all 0.2s;
}
.form-group input:focus {
  border-color: #38bdf8;
  box-shadow: 0 0 15px rgba(56,189,248,0.15);
}
.form-group input::placeholder { color: #334155; }

.submit-btn {
  width: 100%;
  padding: 0.9rem;
  font-family: 'CinzelBold', serif;
  font-size: 1rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.3s;
  margin-top: 0.5rem;
}
.submit-btn.login-btn {
  background: linear-gradient(135deg, #38bdf8, #0ea5e9);
  color: #0b0f1a;
}
.submit-btn.register-btn {
  background: linear-gradient(135deg, #f5a623, #b8860b);
  color: #0b0f1a;
}
.submit-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(56,189,248,0.3);
}
.submit-btn:active { transform: translateY(0); }

.error-msg {
  text-align: center;
  color: #ef4444;
  font-size: 0.8rem;
  margin-top: 1rem;
  min-height: 1.2rem;
}
.success-msg {
  text-align: center;
  color: #22c55e;
  font-size: 0.8rem;
  margin-top: 1rem;
}

/* Hide forms */
.form { display: none; }
.form.active { display: block; }

/* Animate in */
.auth-box {
  animation: fadeUp 0.5s ease-out;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="auth-box">
  <h1>⚡ Dodge the Shitcoin</h1>
  <div class="subtitle">Enter the arena</div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('login')">Login</button>
    <button class="tab" onclick="showTab('register')">Register</button>
  </div>

  <!-- Login Form -->
  <div class="form active" id="login-form">
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="login-user" placeholder="satoshi" autocomplete="username" maxlength="20">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-pass" placeholder="••••••" autocomplete="current-password">
    </div>
    <button class="submit-btn login-btn" onclick="doLogin()">Enter</button>
  </div>

  <!-- Register Form -->
  <div class="form" id="register-form">
    <div class="form-group">
      <label>Choose Username</label>
      <input type="text" id="reg-user" placeholder="your name" autocomplete="username" maxlength="20">
    </div>
    <div class="form-group">
      <label>Choose Password</label>
      <input type="password" id="reg-pass" placeholder="••••••" autocomplete="new-password">
    </div>
    <button class="submit-btn register-btn" onclick="doRegister()">Create Account</button>
  </div>

  <div class="error-msg" id="error-msg"></div>
</div>

<script>
const API = 'http://localhost:3001/api';

// If already logged in, go straight to game
const existing = localStorage.getItem('dts_token');
if (existing) {
  fetch(`${API}/me`, { headers: { 'Authorization': `Bearer ${existing}` }})
    .then(r => r.ok ? window.location.href = 'index.html' : localStorage.removeItem('dts_token'))
    .catch(() => {});
}

function showTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
  document.getElementById(tab + '-form').classList.add('active');
  document.querySelector(`.tab:${tab === 'login' ? 'first-child' : 'last-child'}`).classList.add('active');
  document.getElementById('error-msg').textContent = '';
}

async function doLogin() {
  const username = document.getElementById('login-user').value.trim();
  const password = document.getElementById('login-pass').value;
  if (!username || !password) return showError('Fill in both fields');

  try {
    const res = await fetch(`${API}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) return showError(data.error || 'Login failed');

    // Save and go
    localStorage.setItem('dts_token', data.token);
    localStorage.setItem('dts_user', JSON.stringify({ id: data.id, username: data.username }));
    window.location.href = 'index.html';
  } catch(e) {
    showError('Server offline — run: cd server && node server.js');
  }
}

async function doRegister() {
  const username = document.getElementById('reg-user').value.trim();
  const password = document.getElementById('reg-pass').value;
  if (!username || !password) return showError('Fill in both fields');

  try {
    const res = await fetch(`${API}/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) return showError(data.error || 'Registration failed');

    // Auto-login
    localStorage.setItem('dts_token', data.token);
    localStorage.setItem('dts_user', JSON.stringify({ id: data.id, username: data.username }));
    window.location.href = 'index.html';
  } catch(e) {
    showError('Server offline — run: cd server && node server.js');
  }
}

function showError(msg) {
  document.getElementById('error-msg').textContent = msg;
}

// Enter key submits
document.querySelectorAll('input').forEach(input => {
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const form = input.closest('.form');
      if (form.id === 'login-form') doLogin();
      else doRegister();
    }
  });
});
</script>
</body>
</html>
