<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodge the Shitcoin</title>

    <link rel="stylesheet" href="styles/style.css">

    <style>
        @font-face {
            font-family: "Cinzel";
            src: url("assets/fonts/cinzel/Cinzel-Regular.ttf") format("truetype");
        }

        @font-face {
            font-family: "CinzelBold";
            src: url("assets/fonts/cinzel/Cinzel-Bold.ttf") format("truetype");
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
</head>

<body>

    <!-- HEADER -->
   <header class="game-header">
    <div class="score-wrapper">
        <span id="player1-score">Satoshi 1: 0</span>
        <span class="divider">✦</span>
        <span id="player2-score">Satoshi 2: 0</span>
    </div>
</header>
    <!-- CONTENEDOR DEL JUEGO -->
    <div id="game-container"></div>

    <script>
    // Auth gate — redirect to login if no token
    (function() {
        const token = localStorage.getItem('dts_token');
        if (!token) { window.location.href = 'login.html'; return; }
        const user = JSON.parse(localStorage.getItem('dts_user') || '{}');
        if (user.username) {
            document.getElementById('player1-score').textContent = user.username;
        }
    })();
    </script>
    <script type="module" src="src/main.js"></script>
</body>

</html>
