<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodge the Shitcoin</title>

    <link rel="stylesheet" href="styles/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Space+Grotesk:wght@400;500;600;700&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">

    <style>
        @font-face {
            font-family: "Cinzel";
            src: url("assets/fonts/cinzel/Cinzel-Regular.ttf") format("truetype");
        }

        @font-face {
            font-family: "CinzelBold";
            src: url("assets/fonts/cinzel/Cinzel-Bold.ttf") format("truetype");
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
</head>

<body>

    <!-- HEADER -->
    <header class="game-header">
        <div class="score-wrapper">
            <div class="score-block p1">
                <span class="score-label">Player 1</span>
                <span class="score-value" id="player1-score">0</span>
            </div>
            <div class="timer-block">
                <span class="timer-label">TIME</span>
                <span class="timer-value" id="game-timer">1:30</span>
            </div>
            <div class="score-block p2">
                <span class="score-label">Player 2</span>
                <span class="score-value" id="player2-score">0</span>
            </div>
        </div>
    </header>
    <!-- CONTENEDOR DEL JUEGO -->
    <div id="game-container"></div>

    <script>
    // Optional auth — show username if logged in
    (function() {
        const user = JSON.parse(localStorage.getItem('dts_user') || '{}');
        if (user.username) {
            const label = document.querySelector('.score-block.p1 .score-label');
            if (label) label.textContent = user.username;
        }
    })();
    </script>
    <script type="module" src="src/main.js"></script>
</body>

</html>
