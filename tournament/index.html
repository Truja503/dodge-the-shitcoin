<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tournament Bracket — Dodge the Shitcoin</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@400;500;600&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0f1a;
  --bg-card: #141927;
  --bg-card-hover: #1a2236;
  --border: #1e293b;
  --gold: #f5a623;
  --gold-bright: #ffd700;
  --gold-dim: #b8860b;
  --green: #22c55e;
  --red: #ef4444;
  --text: #e2e8f0;
  --text-dim: #64748b;
  --text-bright: #f8fafc;
  --accent: #38bdf8;
  --glow-gold: 0 0 20px rgba(245,166,35,0.3);
  --glow-active: 0 0 15px rgba(56,189,248,0.4);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  overflow-x: auto;
}

/* Header */
.header {
  text-align: center;
  padding: 2rem 1rem 1rem;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, #0f1629 0%, var(--bg) 100%);
}
.header h1 {
  font-family: 'Cinzel', serif;
  font-size: 2.2rem;
  font-weight: 900;
  background: linear-gradient(135deg, var(--gold), var(--gold-bright), var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: none;
  filter: drop-shadow(0 0 20px rgba(245,166,35,0.3));
  letter-spacing: 2px;
}
.header .status-badge {
  display: inline-block;
  margin-top: 0.5rem;
  padding: 0.25rem 1rem;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.status-pending { background: rgba(56,189,248,0.15); color: var(--accent); border: 1px solid rgba(56,189,248,0.3); }
.status-active { background: rgba(34,197,94,0.15); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
.status-finished { background: rgba(245,166,35,0.15); color: var(--gold); border: 1px solid rgba(245,166,35,0.3); }

/* Player list (pending) */
.players-section {
  max-width: 600px;
  margin: 2rem auto;
  padding: 0 1rem;
}
.players-section h2 {
  font-family: 'Cinzel', serif;
  color: var(--gold);
  font-size: 1.2rem;
  margin-bottom: 1rem;
}
.player-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 0.5rem;
}
.player-chip {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.5rem 1rem;
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.2s;
}
.player-chip:hover {
  border-color: var(--gold);
  box-shadow: var(--glow-gold);
}
.player-chip .seed { color: var(--text-dim); font-size: 0.7rem; }

/* Bracket — two halves converging to center trophy */
.bracket-container {
  display: flex;
  align-items: stretch;
  justify-content: center;
  gap: 0;
  padding: 2rem 0.5rem;
  min-height: 70vh;
  overflow-x: auto;
}
.bracket-half {
  display: flex;
  align-items: stretch;
}
.bracket-half.left { flex-direction: row; }
.bracket-half.right { flex-direction: row-reverse; }

.round {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  position: relative;
}
/* Rounds shrink as they get closer to center */
.round.r1 { min-width: 200px; }
.round.r2 { min-width: 180px; }
.round.r3 { min-width: 170px; }
.round.r4 { min-width: 160px; }

.round-title {
  text-align: center;
  font-family: 'Cinzel', serif;
  font-size: 0.8rem;
  color: var(--text-dim);
  margin-bottom: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 2px;
}
.match-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin: 8px 12px;
  overflow: hidden;
  transition: all 0.3s;
  cursor: default;
}
.match-card.active {
  border-color: var(--accent);
  box-shadow: var(--glow-active);
  animation: pulse-glow 2s ease-in-out infinite;
}
.match-card.finished { border-color: var(--border); }
.match-card.admin-clickable { cursor: pointer; }
.match-card.admin-clickable:hover {
  border-color: var(--gold);
  box-shadow: var(--glow-gold);
  transform: translateY(-2px);
}
.match-card.waiting {
  border-color: rgba(100,116,139,0.2);
  opacity: 0.6;
}
.waiting-text {
  animation: waiting-pulse 2s ease-in-out infinite;
}
@keyframes waiting-pulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 0.8; }
}

@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 10px rgba(56,189,248,0.2); }
  50% { box-shadow: 0 0 25px rgba(56,189,248,0.5); }
}

.match-player {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.6rem 0.8rem;
  font-size: 0.85rem;
  transition: background 0.2s;
}
.match-player:first-child { border-bottom: 1px solid var(--border); }
.match-player.winner {
  background: rgba(245,166,35,0.08);
}
.match-player.winner .player-name {
  color: var(--gold-bright);
  font-weight: 600;
}
.match-player .player-name {
  flex: 1;
  color: var(--text);
}
.match-player .player-name.empty { color: var(--text-dim); font-style: italic; }
.match-player .score {
  min-width: 28px;
  text-align: center;
  font-weight: 600;
  font-size: 0.9rem;
  color: var(--text-dim);
  padding: 2px 6px;
  border-radius: 4px;
  background: rgba(255,255,255,0.03);
}
.match-player.winner .score {
  color: var(--gold);
  background: rgba(245,166,35,0.1);
}

/* Connectors */
.connector-col {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  width: 30px;
  min-width: 30px;
}
.connector {
  position: relative;
  flex: 1;
  min-height: 40px;
}
.connector::before, .connector::after {
  content: '';
  position: absolute;
  right: 0;
  border-color: var(--border);
  border-style: solid;
}
.connector-top::before {
  top: 50%;
  width: 100%;
  height: 50%;
  border-width: 1px 1px 0 0;
  border-radius: 0 8px 0 0;
}
.connector-bottom::before {
  bottom: 50%;
  width: 100%;
  height: 50%;
  border-width: 0 1px 1px 0;
  border-radius: 0 0 8px 0;
}
/* Mirror connectors for right half */
.bracket-half.right .connector-top::before {
  border-width: 1px 0 0 1px;
  border-radius: 8px 0 0 0;
  right: auto; left: 0;
}
.bracket-half.right .connector-bottom::before {
  border-width: 0 0 1px 1px;
  border-radius: 0 0 0 8px;
  right: auto; left: 0;
}

/* Champion — center focal point */
.champion-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 160px;
  padding: 1.5rem 1rem;
  position: relative;
}
.trophy {
  font-size: 5.5rem;
  margin-bottom: 0.8rem;
  filter: drop-shadow(0 0 40px rgba(255,215,0,0.8)) drop-shadow(0 0 80px rgba(255,215,0,0.4));
  animation: trophy-glow 3s ease-in-out infinite;
}
@keyframes trophy-glow {
  0%, 100% { filter: drop-shadow(0 0 30px rgba(255,215,0,0.6)) drop-shadow(0 0 60px rgba(255,215,0,0.3)); transform: scale(1); }
  50% { filter: drop-shadow(0 0 50px rgba(255,215,0,1)) drop-shadow(0 0 100px rgba(255,215,0,0.5)); transform: scale(1.05); }
}
.champion-name {
  font-family: 'Cinzel', serif;
  font-size: 1.4rem;
  font-weight: 900;
  color: var(--gold-bright);
  text-align: center;
  text-shadow: 0 0 30px rgba(255,215,0,0.6), 0 0 60px rgba(255,215,0,0.3);
}
.champion-label {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 4px;
  color: var(--gold-dim);
  margin-top: 0.4rem;
  font-family: 'Cinzel', serif;
}
/* Radial glow behind trophy */
.champion-section::before {
  content: '';
  position: absolute;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,215,0,0.08) 0%, transparent 70%);
  pointer-events: none;
}

/* Admin panel */
.admin-bar {
  background: linear-gradient(135deg, rgba(245,166,35,0.05), rgba(245,166,35,0.02));
  border: 1px solid rgba(245,166,35,0.2);
  border-radius: 12px;
  max-width: 600px;
  margin: 1.5rem auto;
  padding: 1rem 1.5rem;
  text-align: center;
}
.admin-bar h3 {
  font-family: 'Cinzel', serif;
  color: var(--gold);
  font-size: 0.9rem;
  margin-bottom: 0.5rem;
}
.btn {
  display: inline-block;
  padding: 0.6rem 1.5rem;
  border-radius: 8px;
  border: none;
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.2s;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.btn-gold {
  background: linear-gradient(135deg, var(--gold), var(--gold-dim));
  color: #0b0f1a;
}
.btn-gold:hover {
  box-shadow: var(--glow-gold);
  transform: translateY(-1px);
}
.btn-gold:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 2rem;
  min-width: 320px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.modal h3 {
  font-family: 'Cinzel', serif;
  color: var(--gold);
  margin-bottom: 1.5rem;
  text-align: center;
}
.modal-match-info {
  display: flex;
  align-items: center;
  justify-content: space-around;
  margin-bottom: 1.5rem;
  gap: 1rem;
}
.modal-player {
  text-align: center;
  flex: 1;
}
.modal-player .name {
  font-weight: 600;
  font-size: 1rem;
  margin-bottom: 0.5rem;
}
.modal-player input {
  width: 70px;
  padding: 0.5rem;
  text-align: center;
  font-size: 1.2rem;
  font-weight: 700;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text-bright);
  outline: none;
}
.modal-player input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 10px rgba(245,166,35,0.2);
}
.modal-vs {
  font-family: 'Cinzel', serif;
  font-size: 1.2rem;
  color: var(--text-dim);
}
.modal-actions {
  display: flex;
  gap: 0.5rem;
  justify-content: center;
  margin-top: 1rem;
}
.btn-cancel {
  background: var(--bg);
  color: var(--text-dim);
  border: 1px solid var(--border);
}
.btn-cancel:hover { border-color: var(--text-dim); }

/* Game overlay */
.game-overlay {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: #0b0f1a;
}
.game-overlay-header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  height: 50px;
  background: rgba(5,8,15,0.95);
  border-bottom: 1px solid rgba(245,166,35,0.2);
  font-family: 'Orbitron', sans-serif;
}
.game-p1-name { color: #38bdf8; font-size: 1.1rem; font-weight: 700; }
.game-p2-name { color: #f5a623; font-size: 1.1rem; font-weight: 700; }
.game-vs { color: #64748b; font-size: 0.9rem; }
.game-overlay-status {
  text-align: center;
  padding: 8px;
  font-family: 'Cinzel', serif;
  color: #64748b;
  font-size: 0.8rem;
}

/* Stats panel */
.stats-panel {
  display: none;
  position: fixed;
  right: 0;
  top: 0;
  width: 300px;
  height: 100vh;
  background: var(--bg-card);
  border-left: 1px solid var(--border);
  padding: 2rem 1.5rem;
  z-index: 50;
  overflow-y: auto;
  box-shadow: -10px 0 40px rgba(0,0,0,0.3);
}
.stats-panel.active { display: block; }
.stats-panel h3 {
  font-family: 'Cinzel', serif;
  color: var(--gold);
  margin-bottom: 1rem;
}
.stats-panel .close-btn {
  position: absolute;
  top: 1rem;
  right: 1rem;
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 1.5rem;
  cursor: pointer;
}
.stat-row {
  display: flex;
  justify-content: space-between;
  padding: 0.5rem 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.85rem;
}
.stat-label { color: var(--text-dim); }
.stat-value { color: var(--text-bright); font-weight: 600; }

/* Share box */
.share-box {
  max-width: 600px;
  margin: 1rem auto;
  text-align: center;
  font-size: 0.8rem;
  color: var(--text-dim);
}
.share-box code {
  background: var(--bg-card);
  padding: 0.2rem 0.6rem;
  border-radius: 4px;
  color: var(--accent);
  font-size: 0.85rem;
}

/* Loading */
.loading {
  text-align: center;
  padding: 4rem;
  font-family: 'Cinzel', serif;
  color: var(--text-dim);
}
.loading::after {
  content: '';
  animation: dots 1.5s infinite;
}
@keyframes dots {
  0% { content: '.'; }
  33% { content: '..'; }
  66% { content: '...'; }
}

/* Responsive */
@media (max-width: 768px) {
  .header h1 { font-size: 1.5rem; }
  .round { min-width: 170px; }
  .bracket-container { padding: 1rem 0.5rem; }
}
</style>
</head>
<body>

<div class="header">
  <h1 id="tournament-name">Loading...</h1>
  <div id="status-badge" class="status-badge status-pending">Loading</div>
</div>

<div id="admin-bar" class="admin-bar" style="display:none;">
  <h3>⚡ Admin Panel</h3>
  <button id="start-btn" class="btn btn-gold" onclick="startTournament()">Start Tournament</button>
  <p style="margin-top:0.5rem;font-size:0.75rem;color:var(--text-dim)">Click on any pending match to report scores</p>
</div>

<div id="share-box" class="share-box"></div>

<div id="players-section" class="players-section" style="display:none;">
  <h2>👥 Players (<span id="player-count">0</span>/<span id="max-players">16</span>)</h2>
  <div id="player-list" class="player-list"></div>
</div>

<div id="bracket-container" class="bracket-container">
  <div class="loading" id="loading">Loading bracket</div>
</div>

<!-- Game Overlay (embedded match) -->
<div class="game-overlay" id="game-overlay" style="display:none;">
  <div class="game-overlay-header">
    <span class="game-p1-name" id="game-p1-name">Player 1</span>
    <span class="game-vs">VS</span>
    <span class="game-p2-name" id="game-p2-name">Player 2</span>
  </div>
  <div class="game-overlay-status" id="game-overlay-status"></div>
  <iframe id="game-iframe" src="" style="width:100%;height:calc(100vh - 80px);border:none;" allow="gamepad"></iframe>
</div>

<!-- Score Modal (fallback for manual reporting) -->
<div class="modal-overlay" id="score-modal">
  <div class="modal">
    <h3>Report Match Result</h3>
    <div class="modal-match-info">
      <div class="modal-player">
        <div class="name" id="modal-p1">Player 1</div>
        <input type="number" id="modal-s1" min="0" value="0">
      </div>
      <div class="modal-vs">VS</div>
      <div class="modal-player">
        <div class="name" id="modal-p2">Player 2</div>
        <input type="number" id="modal-s2" min="0" value="0">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn btn-gold" onclick="submitScore()">Submit</button>
    </div>
  </div>
</div>

<!-- Stats Panel -->
<div class="stats-panel" id="stats-panel">
  <button class="close-btn" onclick="closeStats()">✕</button>
  <h3 id="stats-name">Player Stats</h3>
  <div id="stats-content"></div>
</div>

<script>
const API = 'http://localhost:3001/api';
const params = new URLSearchParams(window.location.search);
const tournamentKey = params.get('key');
const adminKey = params.get('admin');
let tournament = null;
let ws = null;
let currentMatchId = null;

const roundNames = {
  1: { 16: 'Round of 16', 8: 'Quarter-finals', 4: 'Semi-finals', 2: 'Final' },
  2: { 16: 'Quarter-finals', 8: 'Semi-finals', 4: 'Final' },
  3: { 16: 'Semi-finals', 8: 'Final' },
  4: { 16: 'Final' }
};

function getRoundName(round, format) {
  const totalRounds = Math.log2(format);
  const roundFromEnd = totalRounds - round;
  if (roundFromEnd === 0) return 'Final';
  if (roundFromEnd === 1) return 'Semi-finals';
  if (roundFromEnd === 2) return 'Quarter-finals';
  return 'Round of ' + Math.pow(2, totalRounds - round + 1);
}

async function loadTournament() {
  if (!tournamentKey) {
    document.getElementById('loading').textContent = 'No tournament key provided. Add ?key=XXXXX to the URL.';
    return;
  }
  try {
    const res = await fetch(`${API}/tournaments/${tournamentKey}`);
    if (!res.ok) throw new Error('Not found');
    tournament = await res.json();
    render();
    connectWS();
  } catch (e) {
    document.getElementById('loading').textContent = 'Tournament not found.';
  }
}

function connectWS() {
  try {
    ws = new WebSocket(`ws://localhost:3001`);
    ws.onopen = () => ws.send(JSON.stringify({ type: 'subscribe', key: tournamentKey }));
    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'bracket_update' && msg.tournament) {
          tournament = msg.tournament;
          render();
        }
      } catch (err) {}
    };
    ws.onclose = () => setTimeout(connectWS, 3000);
  } catch (e) {}
}

function render() {
  if (!tournament) return;

  // Header
  document.getElementById('tournament-name').textContent = tournament.name;
  const badge = document.getElementById('status-badge');
  badge.textContent = tournament.status.toUpperCase();
  badge.className = 'status-badge status-' + tournament.status;

  // Share box
  const shareBox = document.getElementById('share-box');
  const url = window.location.origin + window.location.pathname;
  shareBox.innerHTML = `Share link: <code>${url}?key=${tournamentKey}</code>`;

  // Admin bar
  const adminBar = document.getElementById('admin-bar');
  if (adminKey) {
    adminBar.style.display = 'block';
    const startBtn = document.getElementById('start-btn');
    startBtn.style.display = tournament.status === 'pending' ? 'inline-block' : 'none';
    startBtn.disabled = tournament.players.length < 2;
  }

  // Always show players section if pending
  if (tournament.status === 'pending') {
    renderPlayerList();
  } else {
    document.getElementById('players-section').style.display = 'none';
  }

  // ALWAYS render bracket (even if pending, show waiting slots)
  renderBracket();
}

function renderPlayerList() {
  const section = document.getElementById('players-section');
  section.style.display = 'block';
  const format = parseInt(tournament.format) || 16;
  document.getElementById('player-count').textContent = tournament.players.length;
  document.getElementById('max-players').textContent = format;

  const list = document.getElementById('player-list');
  list.innerHTML = tournament.players.map(p =>
    `<div class="player-chip" onclick="showStats('${p.username}')">${p.username}</div>`
  ).join('');
}

function renderBracket() {
  const container = document.getElementById('bracket-container');
  const format = parseInt(tournament.format) || 16;
  const totalRounds = Math.log2(format); // 1 for 2, 2 for 4, 3 for 8, 4 for 16
  const matches = tournament.matches || [];
  const players = tournament.players || [];

  // Split matches into left half (matches 1-4 of R16, 1-2 of QF, 1 of SF)
  // and right half (matches 5-8 of R16, 3-4 of QF, 2 of SF)
  // Final is the center trophy match

  function buildHalf(side) {
    let html = '';
    // Build rounds for this half (all rounds except final)
    const roundsPerHalf = [];
    for (let r = 1; r < totalRounds; r++) {
      const matchesInRound = format / Math.pow(2, r);
      const halfCount = matchesInRound / 2;
      roundsPerHalf.push({
        round: r,
        count: halfCount,
        offset: side === 'left' ? 0 : halfCount
      });
    }
    // For format=2, there's only a final, no halves needed
    if (roundsPerHalf.length === 0) return '';

    for (let ri = 0; ri < roundsPerHalf.length; ri++) {
      const { round, count, offset } = roundsPerHalf[ri];
      const realMatches = matches.filter(m => m.round === round).sort((a, b) => a.match_number - b.match_number);
      const roundName = getRoundName(round, format);

      // Connector before (except first round)
      if (ri > 0) {
        const prevCount = roundsPerHalf[ri - 1].count;
        html += '<div class="connector-col">';
        for (let i = 0; i < prevCount; i++) {
          html += `<div class="connector ${i % 2 === 0 ? 'connector-top' : 'connector-bottom'}"></div>`;
        }
        html += '</div>';
      }

      html += `<div class="round r${round}">`;
      html += `<div class="round-title">${roundName}</div>`;

      for (let i = 0; i < count; i++) {
        const matchNum = offset + i + 1;
        const match = realMatches.find(rm => rm.match_number === matchNum);

        if (match) {
          const isActive = match.status === 'pending' && match.player1_id && match.player2_id;
          const isFinished = match.status === 'finished';
          const canClick = isActive && (adminKey || match.player1_id && match.player2_id);

          let clickHandler = '';
          if (isActive && adminKey) {
            clickHandler = `onclick="launchMatch(${match.id}, '${(match.player1_name || '').replace(/'/g, "\\'")}', '${(match.player2_name || '').replace(/'/g, "\\'")}')"`;
          } else if (isActive && !adminKey && match.player1_name && match.player2_name) {
            clickHandler = `onclick="spectateMatch(${match.id}, '${(match.player1_name || '').replace(/'/g, "\\'")}', '${(match.player2_name || '').replace(/'/g, "\\'")}')"`;
          }

          html += `<div class="match-card ${isActive ? 'active' : ''} ${isFinished ? 'finished' : ''} ${canClick ? 'admin-clickable' : ''}"
            ${clickHandler}>`;
          html += renderMatchPlayer(match.player1_name, match.player1_score, match.winner_id && match.winner_id === match.player1_id, isFinished);
          html += renderMatchPlayer(match.player2_name, match.player2_score, match.winner_id && match.winner_id === match.player2_id, isFinished);
          html += '</div>';
        } else if (round === 1 && tournament.status === 'pending') {
          const slot1 = (matchNum - 1) * 2;
          const slot2 = (matchNum - 1) * 2 + 1;
          const p1 = players[slot1] ? players[slot1].username : null;
          const p2 = players[slot2] ? players[slot2].username : null;
          html += `<div class="match-card waiting">`;
          html += renderWaitingPlayer(p1);
          html += renderWaitingPlayer(p2);
          html += '</div>';
        } else {
          html += `<div class="match-card waiting">`;
          html += renderWaitingPlayer(null);
          html += renderWaitingPlayer(null);
          html += '</div>';
        }
      }
      html += '</div>';
    }

    // Connector before final (from SF)
    html += '<div class="connector-col">';
    html += `<div class="connector connector-top"></div>`;
    html += '</div>';

    return html;
  }

  // Build: LEFT half → TROPHY center → RIGHT half
  let html = '';

  // Left half (R16 matches 1-4 → QF 1-2 → SF 1)
  html += '<div class="bracket-half left">';
  html += buildHalf('left');
  html += '</div>';

  // Champion / Final in center
  const finalMatch = matches.find(m => m.round === totalRounds);
  html += '<div class="champion-section">';
  if (finalMatch && finalMatch.status === 'finished' && finalMatch.winner_name) {
    html += `<div class="trophy">🏆</div>`;
    html += `<div class="champion-name">${finalMatch.winner_name}</div>`;
    html += `<div class="champion-label">Champion</div>`;
  } else {
    // Show final match card above trophy
    if (finalMatch && finalMatch.player1_name) {
      const finalActive = finalMatch.status === 'pending' && finalMatch.player1_id && finalMatch.player2_id;
      let finalClick = '';
      if (finalActive && adminKey) {
        finalClick = `onclick="launchMatch(${finalMatch.id}, '${(finalMatch.player1_name||'').replace(/'/g,"\\'")}', '${(finalMatch.player2_name||'').replace(/'/g,"\\'")}')"`; 
      } else if (finalActive && !adminKey) {
        finalClick = `onclick="spectateMatch(${finalMatch.id}, '${(finalMatch.player1_name||'').replace(/'/g,"\\'")}', '${(finalMatch.player2_name||'').replace(/'/g,"\\'")}')"`; 
      }
      html += `<div class="match-card ${finalActive ? 'active admin-clickable' : ''}" style="margin-bottom:1rem;min-width:160px;" ${finalClick}>`;
      html += renderMatchPlayer(finalMatch.player1_name, finalMatch.player1_score, false, false);
      html += renderMatchPlayer(finalMatch.player2_name, finalMatch.player2_score, false, false);
      html += '</div>';
    }
    html += `<div class="trophy" style="opacity:0.3">🏆</div>`;
    html += `<div class="champion-name" style="opacity:0.3">???</div>`;
    html += `<div class="champion-label">Champion</div>`;
  }
  html += '</div>';

  // Right half (R16 matches 5-8 → QF 3-4 → SF 2) — reversed order
  html += '<div class="bracket-half right">';
  html += buildHalf('right');
  html += '</div>';

  container.innerHTML = html;
}

function renderWaitingPlayer(name) {
  if (name) {
    return `<div class="match-player">
      <span class="player-name" onclick="event.stopPropagation(); showStats('${name}')">${name}</span>
      <span class="score">—</span>
    </div>`;
  }
  return `<div class="match-player">
    <span class="player-name empty waiting-text">Waiting for player...</span>
    <span class="score">—</span>
  </div>`;
}

function renderMatchPlayer(name, score, isWinner, isFinished) {
  const displayName = name || 'Waiting for player...';
  const nameClass = name ? 'player-name' : 'player-name empty waiting-text';
  const playerClass = isWinner ? 'match-player winner' : 'match-player';
  const scoreDisplay = isFinished ? (score ?? 0) : '—';
  const clickHandler = name ? `onclick="event.stopPropagation(); showStats('${name}')"` : '';

  return `<div class="${playerClass}">
    <span class="${nameClass}" ${clickHandler}>${displayName}</span>
    <span class="score">${scoreDisplay}</span>
  </div>`;
}

async function startTournament() {
  if (!adminKey) return;
  const btn = document.getElementById('start-btn');
  btn.disabled = true;
  btn.textContent = 'Starting...';
  try {
    const res = await fetch(`${API}/tournaments/${tournamentKey}/start`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ adminKey })
    });
    const data = await res.json();
    if (!res.ok) alert(data.error || 'Failed to start');
  } catch (e) {
    alert('Network error');
  }
  btn.textContent = 'Start Tournament';
}

function openScoreModal(matchId, p1Name, p2Name) {
  currentMatchId = matchId;
  document.getElementById('modal-p1').textContent = p1Name;
  document.getElementById('modal-p2').textContent = p2Name;
  document.getElementById('modal-s1').value = 0;
  document.getElementById('modal-s2').value = 0;
  document.getElementById('score-modal').classList.add('active');
}

function closeModal() {
  document.getElementById('score-modal').classList.remove('active');
  currentMatchId = null;
}

async function submitScore() {
  if (!currentMatchId || !adminKey) return;
  const s1 = parseInt(document.getElementById('modal-s1').value) || 0;
  const s2 = parseInt(document.getElementById('modal-s2').value) || 0;
  try {
    const res = await fetch(`${API}/tournaments/${tournamentKey}/match/${currentMatchId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ adminKey, player1Score: s1, player2Score: s2 })
    });
    const data = await res.json();
    if (!res.ok) alert(data.error || 'Failed');
  } catch (e) {
    alert('Network error');
  }
  closeModal();
}

async function showStats(username) {
  const panel = document.getElementById('stats-panel');
  const content = document.getElementById('stats-content');
  document.getElementById('stats-name').textContent = username;
  content.innerHTML = '<div style="color:var(--text-dim)">Loading...</div>';
  panel.classList.add('active');

  try {
    const res = await fetch(`${API}/users/${username}/stats`);
    const data = await res.json();
    const s = data.stats || {};
    content.innerHTML = `
      <div class="stat-row"><span class="stat-label">Games Played</span><span class="stat-value">${s.games_played || 0}</span></div>
      <div class="stat-row"><span class="stat-label">Games Won</span><span class="stat-value">${s.games_won || 0}</span></div>
      <div class="stat-row"><span class="stat-label">Tournaments Won</span><span class="stat-value">🏆 ${s.tournaments_won || 0}</span></div>
      <div class="stat-row"><span class="stat-label">Win Rate</span><span class="stat-value">${s.games_played ? Math.round((s.games_won / s.games_played) * 100) : 0}%</span></div>
    `;
  } catch (e) {
    content.innerHTML = '<div style="color:var(--red)">Failed to load stats</div>';
  }
}

function closeStats() {
  document.getElementById('stats-panel').classList.remove('active');
}

// Close modal on overlay click
document.getElementById('score-modal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('score-modal')) closeModal();
});

// ═══════════════════════════════════════════════════════════
// EMBEDDED MATCH (launch game in iframe)
// ═══════════════════════════════════════════════════════════
function launchMatch(matchId, p1Name, p2Name) {
  const overlay = document.getElementById('game-overlay');
  const iframe = document.getElementById('game-iframe');
  document.getElementById('game-p1-name').textContent = p1Name;
  document.getElementById('game-p2-name').textContent = p2Name;
  document.getElementById('game-overlay-status').textContent = 'Loading match...';

  const matchUrl = `match.html?p1=${encodeURIComponent(p1Name)}&p2=${encodeURIComponent(p2Name)}&matchId=${matchId}&tournamentKey=${tournamentKey}&adminKey=${adminKey}&spectator=false`;
  iframe.src = matchUrl;
  overlay.style.display = 'block';
}

function spectateMatch(matchId, p1Name, p2Name) {
  const overlay = document.getElementById('game-overlay');
  const iframe = document.getElementById('game-iframe');
  document.getElementById('game-p1-name').textContent = p1Name;
  document.getElementById('game-p2-name').textContent = p2Name;
  document.getElementById('game-overlay-status').textContent = 'Spectating...';

  const matchUrl = `match.html?p1=${encodeURIComponent(p1Name)}&p2=${encodeURIComponent(p2Name)}&matchId=${matchId}&tournamentKey=${tournamentKey}&spectator=true`;
  iframe.src = matchUrl;
  overlay.style.display = 'block';
}

window.addEventListener('message', (e) => {
  if (!e.data) return;
  if (e.data.type === 'match_complete') {
    document.getElementById('game-overlay-status').textContent =
      `${e.data.winner} wins! (${e.data.p1Score} - ${e.data.p2Score})`;
  }
  if (e.data.type === 'match_close') {
    document.getElementById('game-overlay').style.display = 'none';
    document.getElementById('game-iframe').src = '';
    loadTournament();
  }
});

// Init
loadTournament();
</script>
