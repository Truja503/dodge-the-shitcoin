<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Match — Dodge the Shitcoin</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Orbitron:wght@400;500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        @font-face { font-family: "Cinzel"; src: url("../assets/fonts/cinzel/Cinzel-Regular.ttf") format("truetype"); }
        @font-face { font-family: "CinzelBold"; src: url("../assets/fonts/cinzel/Cinzel-Bold.ttf") format("truetype"); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0b0f1a; overflow: hidden; }
        #match-hud {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            display: flex; justify-content: center; align-items: center;
            height: 50px; gap: 30px;
            background: rgba(5,8,15,0.9); backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(245,166,35,0.15);
            font-family: 'Orbitron', sans-serif;
        }
        .match-p1 { color: #38bdf8; font-weight: 700; font-size: 0.95rem; }
        .match-score { color: #e2e8f0; font-size: 1.5rem; font-weight: 900; }
        .match-timer { color: #e2e8f0; font-size: 1.2rem; font-family: 'Orbitron', sans-serif; }
        .match-timer.urgent { color: #ef4444; animation: pulse 0.5s infinite; }
        .match-p2 { color: #f5a623; font-weight: 700; font-size: 0.95rem; }
        #spectator-badge {
            display: none; position: fixed; top: 55px; left: 50%; transform: translateX(-50%);
            background: rgba(245,166,35,0.15); color: #f5a623; padding: 4px 16px; border-radius: 20px;
            font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 3px; z-index: 1001;
            border: 1px solid rgba(245,166,35,0.3);
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
        #match-container { width: 100vw; height: 100vh; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
</head>
<body>
    <div id="match-hud">
        <span class="match-p1" id="match-p1-name">Player 1</span>
        <span class="match-score" id="match-p1-score">0</span>
        <span class="match-timer" id="match-timer">First to 21</span>
        <span class="match-score" id="match-p2-score">0</span>
        <span class="match-p2" id="match-p2-name">Player 2</span>
    </div>
    <div id="spectator-badge">👁 SPECTATING</div>
    <div id="match-container"></div>
    <script type="module" src="../src/tournament-match-main.js"></script>
</body>
</html>
