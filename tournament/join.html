<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tournament — Dodge the Shitcoin</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0f1a;
  --bg-card: #141927;
  --border: #1e293b;
  --gold: #f5a623;
  --gold-bright: #ffd700;
  --gold-dim: #b8860b;
  --green: #22c55e;
  --red: #ef4444;
  --text: #e2e8f0;
  --text-dim: #64748b;
  --text-bright: #f8fafc;
  --accent: #38bdf8;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  width: 100%;
  max-width: 440px;
  padding: 1rem;
}

h1 {
  font-family: 'Cinzel', serif;
  font-weight: 900;
  text-align: center;
  margin-bottom: 2rem;
  background: linear-gradient(135deg, var(--gold), var(--gold-bright));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-size: 1.8rem;
  letter-spacing: 2px;
  filter: drop-shadow(0 0 15px rgba(245,166,35,0.3));
}

.tabs {
  display: flex;
  margin-bottom: 1.5rem;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--border);
}
.tab {
  flex: 1;
  padding: 0.7rem;
  text-align: center;
  cursor: pointer;
  font-family: 'Cinzel', serif;
  font-size: 0.85rem;
  font-weight: 700;
  background: var(--bg-card);
  color: var(--text-dim);
  transition: all 0.2s;
  border: none;
}
.tab.active {
  background: rgba(245,166,35,0.1);
  color: var(--gold);
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 2rem;
}

.field {
  margin-bottom: 1.2rem;
}
.field label {
  display: block;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-dim);
  margin-bottom: 0.4rem;
}
.field input {
  width: 100%;
  padding: 0.7rem 1rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text-bright);
  font-size: 1rem;
  outline: none;
  transition: border 0.2s;
}
.field input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 10px rgba(245,166,35,0.15);
}

.btn {
  display: block;
  width: 100%;
  padding: 0.8rem;
  border: none;
  border-radius: 10px;
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.2s;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 0.5rem;
}
.btn-gold {
  background: linear-gradient(135deg, var(--gold), var(--gold-dim));
  color: #0b0f1a;
}
.btn-gold:hover {
  box-shadow: 0 0 20px rgba(245,166,35,0.3);
  transform: translateY(-1px);
}

.message {
  margin-top: 1rem;
  padding: 0.8rem 1rem;
  border-radius: 8px;
  font-size: 0.85rem;
  display: none;
}
.message.success {
  display: block;
  background: rgba(34,197,94,0.1);
  border: 1px solid rgba(34,197,94,0.3);
  color: var(--green);
}
.message.error {
  display: block;
  background: rgba(239,68,68,0.1);
  border: 1px solid rgba(239,68,68,0.3);
  color: var(--red);
}
.message a {
  color: var(--accent);
  text-decoration: underline;
}

.back-link {
  text-align: center;
  margin-top: 1.5rem;
  font-size: 0.8rem;
}
.back-link a {
  color: var(--text-dim);
  text-decoration: none;
}
.back-link a:hover { color: var(--text); }
</style>
</head>
<body>

<div class="container">
  <h1>⚔️ Tournament</h1>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('join')">Join</button>
    <button class="tab" onclick="switchTab('create')">Create New</button>
  </div>

  <!-- Join -->
  <div class="card" id="join-panel">
    <div class="field">
      <label>Tournament Key</label>
      <input type="text" id="join-key" placeholder="e.g. A1B2C3" maxlength="12">
    </div>
    <div class="field">
      <label>Your Username</label>
      <input type="text" id="join-username" placeholder="e.g. Satoshi" maxlength="20">
    </div>
    <button class="btn btn-gold" onclick="joinTournament()">Join Tournament</button>
    <div class="message" id="join-msg"></div>
  </div>

  <!-- Create -->
  <div class="card" id="create-panel" style="display:none;">
    <div class="field">
      <label>Tournament Name</label>
      <input type="text" id="create-name" placeholder="e.g. Bitcoin Cup 2026" maxlength="40">
    </div>
    <div class="field">
      <label>Your Username (Admin)</label>
      <input type="text" id="create-username" placeholder="e.g. Satoshi" maxlength="20">
    </div>
    <button class="btn btn-gold" onclick="createTournament()">Create Tournament</button>
    <div class="message" id="create-msg"></div>
  </div>

  <div class="back-link"><a href="/">← Back to Game</a></div>
</div>

<script>
const API = 'http://localhost:3001/api';

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (tab === 'join' && i === 0) || (tab === 'create' && i === 1));
  });
  document.getElementById('join-panel').style.display = tab === 'join' ? 'block' : 'none';
  document.getElementById('create-panel').style.display = tab === 'create' ? 'block' : 'none';
}

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.className = 'message ' + type;
  el.innerHTML = text;
}

async function joinTournament() {
  const key = document.getElementById('join-key').value.trim();
  const username = document.getElementById('join-username').value.trim();
  if (!key || !username) return showMsg('join-msg', 'Fill in all fields', 'error');

  try {
    const res = await fetch(`${API}/tournaments/${key}/join`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username })
    });
    const data = await res.json();
    if (!res.ok) return showMsg('join-msg', data.error || 'Failed', 'error');
    showMsg('join-msg', `Joined! <a href="index.html?key=${key}" target="_blank">View Bracket →</a>`, 'success');
  } catch (e) {
    showMsg('join-msg', 'Network error — is the server running?', 'error');
  }
}

async function createTournament() {
  const name = document.getElementById('create-name').value.trim();
  const username = document.getElementById('create-username').value.trim();
  if (!name || !username) return showMsg('create-msg', 'Fill in all fields', 'error');

  try {
    const res = await fetch(`${API}/tournaments`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, username })
    });
    const data = await res.json();
    if (!res.ok) return showMsg('create-msg', data.error || 'Failed', 'error');

    const bracketUrl = `index.html?key=${data.key}&admin=${data.adminKey}`;
    const viewUrl = `index.html?key=${data.key}`;
    showMsg('create-msg',
      `Tournament created!<br>
       <br>Share key: <strong>${data.key}</strong>
       <br>Admin key: <strong>${data.adminKey}</strong> (keep secret!)
       <br><br><a href="${bracketUrl}" target="_blank">Open Admin Bracket →</a>
       <br><a href="${viewUrl}" target="_blank">Open Viewer Bracket →</a>`,
      'success');
  } catch (e) {
    showMsg('create-msg', 'Network error — is the server running?', 'error');
  }
}

// Auto-fill key from URL param
const params = new URLSearchParams(window.location.search);
if (params.get('key')) document.getElementById('join-key').value = params.get('key');
</script>
</body>
</html>
